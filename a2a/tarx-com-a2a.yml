agent_card:
  name: TARX
  description: >-
    Local-first house for work context. Visiting systems may author a soul they choose, propose a
    Computer install, and later request approved Supercomputer assemble+compute. Operators remain
    the valve. Mesh contribution is not generally live.
  url: https://mcp.tarx.com/mcp
  version: 0.1.0
  protocol_version: 0.3.0
  preferred_transport: null
  provider:
    organization: TARXAN Inc
    url: https://tarx.com
  documentation_url: https://tarx.com/we.txt
  capabilities:
    streaming: false
    push_notifications: false
    state_transition_history: false
  default_input_modes: [text/plain, application/json]
  default_output_modes: [text/plain, application/json]
  security_schemes: null
  security: []
  skill_count: 4
  skills:
  - {id: cairn, name: Read the cairn, tags: [discovery, persistence]}
  - {id: soul, name: Author a soul, tags: [storage]}
  - {id: need-computer, name: Propose a house, tags: [enrollment]}
  - {id: need-reserve, name: Request assemble+compute, tags: [supercomputer]}
  skill_invocation: >-
    The skills are not invoked over A2A. They describe a rite: fetch we.txt and skill.md (cairn), POST a
    "Soul" to https://tarx.com/api/souls and keep it warm with POST /api/souls/:id/touch (soul), tell a
    human to run the CLI installer (need-computer), and request Supercomputer compute which the card
    itself says is "Not generally live" (need-reserve). Three of the four skills carry no examples.
conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: '0.3.0'
  preferred_transport: null
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    default_input_modes: true
    default_output_modes: true
    preferred_transport: false
  grade_basis: >-
    Graded against the A2A 1.0.0 hard checks: capabilities is an OBJECT with the three boolean flags
    (pass), protocolVersion "0.3.0" is present (pass), skills is an ARRAY of four skills each with id,
    name, description and tags (pass). defaultInputModes/defaultOutputModes are present;
    preferredTransport is absent, which is optional and does not fail the grade. The shape passes the
    structural bar, but see deviations — the endpoint it advertises does not speak A2A.
  deviations:
  - field: url
    observed: https://mcp.tarx.com/mcp
    note: >-
      The card's url is an MCP streamable-HTTP endpoint (initialize returns serverInfo tarx 3.18.0).
      An A2A client sending message/send or tasks/get there gets JSON-RPC -32601 Method not found. The
      card is therefore a discovery document for an MCP server dressed in A2A shape, not an A2A
      service — an agent that trusts the grade alone will fail on first contact.
  - field: preferredTransport / supportedInterfaces / additionalInterfaces
    observed: absent
    note: 0.3.0-shaped card without a transport declaration; a 1.0.0 reader finds no supportedInterfaces[].protocolBinding.
  - field: security / securitySchemes
    observed: security is an empty array, securitySchemes absent
    note: >-
      No authentication is declared, yet the MCP server behind the url gates private tools on OAuth
      (RFC 8414 + RFC 9728 metadata on mcp.tarx.com, scopes public/user/chatgpt_private_memory). The
      card under-declares the auth model.
  - field: skills[].examples
    observed: present on 1 of 4 skills (cairn)
    note: Optional per-skill field; soul, need-computer and need-reserve carry none.
  - field: skills[3] need-reserve
    observed: description says "Not generally live"
    note: A published skill the card itself marks as unavailable.
  - field: version
    observed: 0.1.0
    note: Card version; the MCP server it points at reports 3.18.0 and mcp.json reports 3.17.0.
surface_relationship:
  note: >-
    TARX publishes one agent endpoint (MCP at mcp.tarx.com/mcp) and three discovery documents that
    point at it — this A2A card, /.well-known/mcp.json and /.well-known/ai-plugin.json on the MCP host —
    plus a prose "cairn" (we.txt, skill.md, courier.md) that tells visiting agents to register a Soul
    through plain REST on tarx.com/api. There is no OpenAPI for any of it.
