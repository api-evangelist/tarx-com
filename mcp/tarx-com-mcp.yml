  note: >-
    REMOTE: an anonymous POST of initialize and tools/list to https://mcp.tarx.com/mcp answered 200
    (text/event-stream) with serverInfo {name: tarx, version: 3.18.0} and 22 tools carrying full
    inputSchema, annotations and (for search/fetch) outputSchema. Public-safe tools (tarx_status,
    tarx_skills_list, resources/read on tarx://system/*) execute without credentials; a private tool
    (tarx_memory_search) answers "Authentication required for private memory reads. Provide a Bearer
    token." The provider's own /.well-known/mcp.json states auth.required: false with private memory
    behind OAuth/Bearer, so auth is recorded as oauth (optional for the public subset). LOCAL: the
    documented local MCP is installed by the TARX CLI (tarx-core + tarx-ops server bundles from the
    tarx-cli GitHub releases, wired into Claude Desktop / Claude Code / Cursor / VS Code by `tarx mcp
    add <target>`; `tarx serve` starts the local MCP server per docs.tarx.com/developers/cli).
    docs.tarx.com/developers/mcp ALSO documents `npx @tarx/mcp` as the local server command, but
    registry.npmjs.org/@tarx%2Fmcp returned 404 and an npm scope search for tarx returned zero
    packages on 2026-09-19, so that documented package is not published; the CLI path is the one that
    ships. The install one-liner is served as a shell script only to a curl User-Agent
    (cli.tarx.com/install -> text/plain script; a browser UA is redirected to the HTML
    cli.tarx.com/download page), and the variant `curl -fsSL https://tarx.com/install | sh` printed on
    cli.tarx.com/download and docs.tarx.com/users/install returns a 404 HTML page on tarx.com.
