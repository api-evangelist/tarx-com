  mcp_tarx_com: 'JSON-RPC 2.0 {"jsonrpc":"2.0","error":{"code":<int>,"message":<string>},"id":<id>}; tool-level errors arrive as a 200 result whose content[0].text is a JSON object with an "error" string'
  request_id_header: X-Request-ID (also echoed in the body as request_id)
