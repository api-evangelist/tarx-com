access_flow:
- TARX creates or designates a sandbox developer account.
- TARX seeds only synthetic sample data, or gives the partner the fixture to load into their own mock environment.
- Partner signs in through the normal TARX auth flow (email magic link).
- Partner calls read paths first; write paths remain approval-gated.
reset_and_reseed:
- {action: Read sample fixture, who: Partner, state: Available now}
- {action: Load sample data into a demo account, who: TARX operator, state: Manual / approval required}
- {action: Reset sandbox account, who: TARX operator, state: Manual / approval required}
- {action: Partner self-service reseed, who: Partner, state: Not available}
- {action: Production data import, who: Nobody, state: Blocked}
limitations_stated:
- Hosted Supercomputer use is approval-gated and must show route evidence.
- Local/private context is not exposed through public remote MCP by default.
- Webhook delivery is not live unless a separate approved event contract exists.
- Write, execute, deploy, send, purchase, delete, and external-system calls require explicit approval and proof.
