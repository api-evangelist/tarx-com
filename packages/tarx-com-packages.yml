source: GitHub releases API for tarx-ai/*, registry.npmjs.org, pypi.org, crates.io, formulae.brew.sh (2026-09-19)
note: >-
  TARX publishes no client SDK on any package registry. npm search for "tarx" and scope:tarx returned
  zero first-party packages, PyPI has no tarx / tarx-cli / tarx-mcp, crates.io has no tarx crate and
  Homebrew has no tarx formula. Distribution is a curl|sh installer plus GitHub Releases. The
  packages below are the CLI, the desktop app and the OS build — operator tooling, not API client
  libraries — so no SDKs pointer is emitted. The docs' `npx @tarx/mcp` local-MCP command names an
  npm package that does not exist on the registry (404), recorded here as the honest gap.
packages:
- language: shell
  registry: github-releases
  name: tarx-cli
  url: https://github.com/tarx-ai/tarx-cli
  install: curl -fsSL cli.tarx.com/install | sh
  official: true
  version: v1.1.0
  published: '2026-03-13'
  assets: [tarx-core-bundle.tar.gz, tarx-ops-bundle.tar.gz]
  note: >-
    POSIX shell CLI (1,340 lines, tarx-ai/tarx-cli/main/tarx) — the local control plane. The installer
    script (served to a curl User-Agent from cli.tarx.com/install) fetches the tarx script from
    raw.githubusercontent.com/tarx-ai/tarx-cli/main/tarx and the two MCP server bundles from the
    release assets. Last release predates the current 3.18.0 remote MCP server by six months; the
    repo's last push is 2026-09-06.
