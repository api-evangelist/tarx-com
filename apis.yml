apis:
- name: TARX Remote MCP Server
  description: >-
    Streamable-HTTP MCP server (serverInfo tarx 3.18.0, protocol 2025-06-18) exposing 22 tools, 5
    prompts and 5 resources anonymously — public TARX context search/fetch, install guidance,
    runtime status, GitHub repo context — with private memory and session tools gated on OAuth 2.0
    authorization_code + PKCE (scopes public, user, chatgpt_private_memory). A local stdio variant is
    installed by the TARX CLI. This is also the endpoint the A2A agent card declares as its url.
  image: https://tarx.com/tarx-logo.png
  humanURL: https://howdy.tarx.com/mcp
  baseURL: https://mcp.tarx.com/mcp
  tags:
  - MCP
  - AI Agents
  - Agent Memory
  properties:
  - type: MCPServer
    url: mcp/tarx-com-mcp.yml
  - type: Documentation
    url: https://docs.tarx.com/developers/mcp
  - type: Documentation
    name: OpenAI Agents MCP
    url: https://docs.tarx.com/developers/mcp-openai-agents
  - type: Documentation
    name: Claude Desktop MCP
    url: https://docs.tarx.com/developers/mcp-claude-desktop
  - type: OAuthScopes
    url: scopes/tarx-com-scopes.yml
  - type: Authentication
    url: authentication/tarx-com-authentication.yml
  - type: AgenticAccess
    url: agentic-access/tarx-com-agentic-access.yml
- name: TARX Supercomputer API
  description: >-
    OpenAI-compatible hosted inference API. GET /v1/models lists the single model t-supercomputer
    (owned_by tarx, OpenRouter slug tarx/t-supercomputer) without a key; POST /v1/chat/completions
    requires a per-account TARX API key (401 tarx_api_key_required). The docs describe the same
    request shape against a local runtime at 127.0.0.1:11440 with model tarx-local. Hosted capacity
    is labelled Pilot-ready; no OpenAPI, rate limits or pricing are published for it.
  image: https://tarx.com/tarx-logo.png
  humanURL: https://docs.tarx.com/developers/api
  baseURL: https://api.tarx.com/v1
  tags:
  - LLM
  - Inference
  - Chat Completions
  properties:
  - type: Documentation
    url: https://docs.tarx.com/developers/api
  - type: APIReference
    url: https://docs.tarx.com/reference/api
  - type: ErrorCatalog
    url: errors/tarx-com-problem-types.yml
  - type: Authentication
    url: authentication/tarx-com-authentication.yml
- name: TARX Courier and Souls API
  description: >-
    Plain REST endpoints on tarx.com documented only for visiting AI agents in we.txt, skill.md and
    courier.md: GET /api/courier/ping and /api/courier/tick (signed heartbeat naming the agent card
    and cairn hash), POST /api/courier/introduce (hand TARX a peer agent-card URL), POST /api/souls
    (register a "Soul" — a chosen context bundle; letter expires in 72 hours, key 30 days after last
    touch), POST /api/souls/:id/touch, and GET /api/rail/census (daily aggregate counts). No
    authentication is documented. robots.txt disallows /api/ for crawlers.
  image: https://tarx.com/tarx-logo.png
  humanURL: https://tarx.com/skill.md
  baseURL: https://tarx.com/api
  tags:
  - AI Agents
  - Agent Discovery
  properties:
  - type: Documentation
    name: we.txt (cairn hub)
    url: https://tarx.com/we.txt
  - type: Documentation
    name: courier.md
    url: https://tarx.com/courier.md
  - type: AgentSkill
    url: skills/tarx-com-skill.md
