aid: tarx-com
name: TARXAN Inc
description: >-
  TARXAN Inc (TARX, Austin TX) builds a local-first AI agent runtime: free TARX_OS / TARX Desktop
  software for Apple Silicon Macs, a shell CLI that installs a local inference daemon and local MCP
  servers, an optional hosted "Supercomputer" reached through an OpenAI-compatible API
  (api.tarx.com/v1, model t-supercomputer), and dedicated "Black Box" and humanoid/quadruped hardware.
  Its public agent surface is a remote MCP server at mcp.tarx.com/mcp (22 anonymous tools, OAuth 2.0
  + PKCE for private memory, RFC 8414/9728 metadata) advertised by an A2A 0.3.0 agent card at
  tarx.com/.well-known/agent-card.json and a prose "cairn" (we.txt, skill.md, courier.md) that tells
  visiting agents how to register a Soul through plain REST on tarx.com/api. No OpenAPI is published.
